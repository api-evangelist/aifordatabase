  operations: [updateWorkflow, testWorkflowAction]
- status: 429
  code: RATE_LIMITED
  title: Per-organization rate limit reached
  remediation: Retry with exponential backoff and jitter.
  retryable: true
- status: 5xx
  code: null
  title: Unexpected or transient service error
  remediation: Retry idempotent reads with backoff.
  retryable: conditional
retry_matrix:
  safe_to_retry:
  - GET requests
  - Schema reads and workflow previews
  - Direct read-only SQL when duplicate execution is acceptable
  - 429 and transient 5xx responses after backoff
  do_not_blindly_retry:
  - 'POST /api/v1/workflows/{id}/actions/{order}/test'
  - 'POST /api/v1/workflows/{id}/run'
  - Webhook test deliveries
  - Credential rotation
  - Resource creation when the first response outcome is unknown
  caveat: These calls may have completed even when the caller did not receive a successful response.
  source: https://www.aifordatabase.com/docs/api-errors-and-retries/
