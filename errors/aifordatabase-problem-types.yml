status_catalog:
- status: 400
  code: VALIDATION_ERROR
  title: Malformed body or invalid fields
  remediation: Correct the request; do not retry unchanged.
  retryable: false
- status: 401
  code: UNAUTHORIZED
  title: Missing, invalid, or expired key
  remediation: Replace or rotate the API key. Keys start with afd_ and may carry an expiry.
