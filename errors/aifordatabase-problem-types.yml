- status: 402
  code: null
  title: AI credits exhausted
  remediation: Use direct SQL (executeQuery) which consumes no credits, or top up the budget. Check getUsageBudget to self-throttle.
  retryable: false
  operations: [sendChatMessage]
- status: 403
  code: FORBIDDEN
  title: Missing scope or admin role
  remediation: Request narrower, explicit authorization; workflow_credentials operations also need an org admin role.
  retryable: false
- status: 404
  code: null
  title: Resource absent from this organization
  remediation: Re-discover IDs; do not guess.
  retryable: false
- status: 409
  code: null
  title: Revision or resource conflict
  remediation: Re-read current state before editing. For workflows, read draftRevision and resend expectedDraftRevision.
  retryable: false
  operations: [updateWorkflow, createWorkflowCredential, deleteWorkflowCredential, createMetric, updateMetric, createSavedQuery, updateSavedQuery]
- status: 412
  code: null
  title: Precondition failed
  remediation: Satisfy the stated precondition before retrying.
  retryable: false
  operations: [autoGenerateAnnotations]
- status: 422
  code: null
  title: Connection, preview, or delivery execution failed
  remediation: Inspect error.details and the delivery attempts. For SQL errors, fix the SQL.
  retryable: false
- status: 428
  code: null
  title: Revision or delivery confirmation required
  remediation: Supply the explicit precondition — expectedDraftRevision for draft edits, confirmDelivery=true for an action test.
