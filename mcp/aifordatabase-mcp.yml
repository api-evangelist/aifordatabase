tools:
- name: list_connections
  scope: connections
  rest: GET /connections
  description: List the database connections available to this API key.
- name: get_schema
  scope: connections
  rest: GET /connections/{id}/schema
  description: Get the cached schema (tables, columns, relationships) of a connection.
- name: run_query
  scope: query
  rest: POST /connections/{id}/query
  description: Run SQL directly against a connection; no AI in the loop, no credits consumed. Rows cap at 500.
- name: ask
  scope: chat
  rest: POST /chat
  description: Ask a plain-English question; returns the answer, the SQL used, and the results.
- name: list_workflows
  scope: workflows
  rest: GET /workflows
  description: List scheduled database alerts / reports.
- name: create_workflow
  scope: workflows
  rest: POST /workflows
  description: Create a workflow of SQL steps plus EMAIL/WEBHOOK actions, manual or cron.
- name: run_workflow
  scope: workflows
  rest: POST /workflows/{id}/run
  description: Run a workflow immediately and return the run record.
- name: list_dashboards
  scope: dashboards
  rest: GET /dashboards
  description: List dashboards.
- name: get_usage
  scope: usage
  rest: GET /usage/budget
  description: Read the current AI-credit budget (included, topUp, used, remaining, in cents).
