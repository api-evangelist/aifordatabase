domain_standards:
  note: >-
    Reward-only check, honestly empty. AI for Database sits in text-to-SQL / BI /
    workflow automation, a market with no adopted interchange standard for the API
    layer (no SCIM, OData, OpenRTB, HL7, FHIR, ISO 20022 or equivalent applies). The
    contract declares none, and none was invented to fill the slot. The closest thing
    to a domain contract it does honour is the database dialects themselves — it
    accepts native SQL for POSTGRES, MYSQL, MARIADB, MSSQL, SQLITE and MongoDB query
    syntax — which is a data-source capability, not an API standard.
